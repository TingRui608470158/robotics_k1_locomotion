seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -2.0
    max_log_std: 2.0
    initial_log_std: -1.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 512, 512]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [512, 512, 512]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-3
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.02
  # 明確寫出 observation_preprocessor, 避免觸發 skrl Runner 的舊版命名相容遷移(見
  # skrl/utils/runner/torch/runner.py:95-107)——只寫 state_preprocessor、不寫
  # observation_preprocessor 時, Runner 會判斷成"舊版命名"(舊版 state_preprocessor 其實
  # 指的是現在的 observation_preprocessor), 直接把 state_preprocessor 這個 key 整個刪掉、
  # 改名成 observation_preprocessor——結果就是 policy 的 observations 有正規化, 但 critic
  # 的 STATES 完全沒有 state_preprocessor, 退回恆等函數(不正規化), 餵進 value network 的是
  # 原始尺度的特權觀測(例如 contact_forces 量級到幾百牛頓), 混進其他量級 O(0.1~1) 的維度裡
  # 沒有正規化, value function 擬合出來的估計/advantage 會失真, 這才是加任何 critic-only 欄位
  # 都訓練不穩定的根因, 不是 obs 內容本身的問題
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "k1_train"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 4800
  environment_info: log